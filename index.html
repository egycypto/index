<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PlayStation 5 Store</title>
<style>
  body{font-family:Arial,sans-serif;max-width:420px;margin:40px auto;text-align:center;}
  #console{width:260px;}
  select, button{font-size:15px;padding:6px 10px;margin-top:8px;}
  #qty{width:50px;text-align:center;}
  #specList{list-style:none;padding:0;margin:14px 0;text-align:left;}
  #specList li{background:#f4f6fa;border-left:4px solid #8fa8ff;border-radius:4px;padding:6px 10px;margin:6px 0;font-size:13px;color:#333;}
  #specList li b{color:#111;}
  #consoleBox{background:radial-gradient(circle at 75% 20%, #6b7280 0%, #2b2f36 45%, #1b1e24 100%);border-radius:14px;padding:18px 0 6px;}
  #priceLine{font-size:17px;font-weight:bold;color:#1a2b6b;margin:6px 0 0;}
  #priceLine span{font-size:12px;font-weight:normal;color:#777;display:block;margin-top:2px;}
  #photoCredit{font-size:10px;color:#999;margin-top:4px;}
  #photoCredit a{color:#999;}
  #cartBox div{padding:4px 0;border-bottom:1px solid #eee;font-size:14px;}
  button{cursor:pointer;}
</style>
</head>
<body>

  <div id="consoleBox"></div>
  <div id="photoCredit"></div>

  <div>
    <select id="model" onchange="updateDesc()">
      <option value="std">PS5 Standard (Disc Edition)</option>
      <option value="digital">PS5 Digital Edition</option>
      <option value="slim">PS5 Slim (Disc Edition)</option>
      <option value="slimDigital">PS5 Slim (Digital Edition)</option>
      <option value="pro">PS5 Pro</option>
    </select>
  </div>

  <ul id="specList"></ul>
  <div id="priceLine"></div>

  <div>
    Qty: <input type="number" id="qty" value="1" min="1">
    <button onclick="addToCart()">Add to Cart</button>
  </div>

  <div id="cartBox"></div>
  <button onclick="deleteCart()">Delete Cart</button>

    var accentLine = '<rect x="' + (cx-2) + '" y="' + (topY+16) + '" width="4" height="' + (h-32) + '" rx="2" fill="' + accent + '"/>';
    var slot = hasDisc ?
      '<rect x="' + (cx-midW/2+5) + '" y="' + (topY+34) + '" width="' + (midW-10) + '" height="7" rx="3" fill="#000000"/>' : '';
    var base = '<ellipse cx="' + cx + '" cy="' + (botY+5) + '" rx="30" ry="5" fill="#3a3b40" opacity="0.5"/>';
    var dot = '<circle cx="' + cx + '" cy="' + (botY-20) + '" r="3.2" fill="' + accent + '"/>';

    var stripes = '';
    if (label === 'PS5 PRO') {
      for (var i = 0; i < 3; i++) {
        var sy = topY + 28 + i * 12;
        stripes += '<rect x="' + (cx+midW/2+8) + '" y="' + sy + '" width="34" height="4" rx="2" fill="#0c0d10"/>';
      }
    }

    // Mirrored floor reflection: reuse the same shapes, flipped vertically
    // beneath the base, faded out with a gradient mask.
    var reflection =
      '<g transform="translate(0,' + (2*(botY+8)) + ') scale(1,-1)" opacity="0.28">' +
        leftPanel + rightPanel + spine +
      '</g>' +
      '<rect x="10" y="' + (botY+8) + '" width="240" height="34" fill="url(#gFade)"/>';

    return '<svg viewBox="0 0 260 330" width="260" xmlns="http://www.w3.org/2000/svg">' +
      gradDefs +
      '<defs><linearGradient id="gFade" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#2b2f36" stop-opacity="0"/>' +
        '<stop offset="100%" stop-color="#2b2f36" stop-opacity="1"/>' +
      '</linearGradient></defs>' +
      reflection +
      base + leftPanel + rightPanel + spine + accentLine + slot + dot + stripes +
      '<text x="130" y="16" text-anchor="middle" font-family="Arial" font-size="10" fill="#cfd2d8" letter-spacing="0.5">' + label + '</text>' +
      '</svg>';
  }
  var pics = {
    std:         consoleSvg(true,  false, '#4d7dff', 'PS5'),
    digital:     '<img src="' + digitalPhoto + '" alt="PS5 Digital Edition" style="max-width:220px;max-height:300px;">',
    slim:        consoleSvg(true,  true,  '#4d7dff', 'PS5 SLIM'),
    slimDigital: consoleSvg(false, true,  '#4d7dff', 'SLIM DIGITAL'),
    pro:         consoleSvg(true,  true,  '#ff5a5a', 'PS5 PRO')
  };
  // Only the Digital Edition uses a real photo; others are original illustrations.
  var photoCredits = {
    digital: 'Photo: Wikimedia Commons, CC BY-SA 4.0'
  };

  function updateDesc(){
    var m = document.getElementById("model").value;
    var list = document.getElementById("specList");
    list.innerHTML = "";
    specs[m].forEach(function(item){
      var li = document.createElement("li");
      li.innerHTML = item;
      list.appendChild(li);
    });
    document.getElementById("consoleBox").innerHTML = pics[m];
    document.getElementById("consoleBox").style.background = (m === "digital")
      ? "#ffffff"
      : "radial-gradient(circle at 75% 20%, #6b7280 0%, #2b2f36 45%, #1b1e24 100%)";
    document.getElementById("photoCredit").innerHTML = photoCredits[m]
      ? photoCredits[m] + ' — <a href="https://commons.wikimedia.org/wiki/File:PS5DigitalEdition.png" target="_blank">source</a>'
      : "Illustration for reference — not an official product photo";
    document.getElementById("priceLine").innerHTML =
      "~ " + prices[m].toLocaleString() + " EGP" +
      "<span>Average street price in Egypt, varies by retailer</span>";
  }

  function addToCart(){
    var m = document.getElementById("model").value;
    var qty = document.getElementById("qty").value;
    var line = document.createElement("div");
    line.textContent = names[m] + " — Qty: " + qty;
    document.getElementById("cartBox").appendChild(line);
  }

  function deleteCart(){
    document.getElementById("cartBox").innerHTML = "";
  }

  updateDesc();
</script>

</body>
</html>
